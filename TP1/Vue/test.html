```html
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mon premier test HTML</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f2f2f2;
        padding-top: 100px;
      }

      .card {
        background: white;
        width: 350px;
        margin: auto;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
      }

      button {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        background-color: #42b883;
        color: white;
        cursor: pointer;
      }

      button:hover {
        background-color: #36966f;
      }
    </style>
  </head>

  <body>
    <div id="app" class="card">
      <h1>{{ message }}</h1>

      <p>Mon premier projet Vue fonctionne !</p>

      <button @click="direBonjour">Clique-moi</button>

      <p>{{ resultat }}</p>
    </div>

    <script>
      const { createApp } = Vue;

      createApp({
        data() {
          return {
            message: "Bonjour 👋",
            resultat: "",
          };
        },

        methods: {
          direBonjour() {
            this.resultat = "Bravo ! Vue.js fonctionne aussi 🎉";
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
```
